<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Thanks for stopping by">
  <defs>
    <clipPath id="clip"><rect width="900" height="120" rx="24"/></clipPath>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="120" fill="#000000"/>

    <!-- Two waves drifting at different speeds. The period is 300 px, so shifting by 300 loops seamlessly. -->
    <g>
      <path d="M-300 84 q75 -26 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V120 H-300 Z" fill="url(#fade)"/>
      <path d="M-300 84 q75 -26 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#ff2d95" stroke-width="2"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="300 0" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.55">
      <path d="M-300 96 q75 -20 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0" fill="none" stroke="#ff4da6" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" from="300 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </g>

    <text x="450" y="46" text-anchor="middle" font-size="22" font-weight="600" fill="#ff2d95">
      <tspan font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif">🎀</tspan><tspan font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"> thanks for stopping by</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="119" rx="23.5" fill="none" stroke="#ff2d95" stroke-opacity="0.4"/>
</svg>
